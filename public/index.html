<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Banana Log">
<title>Banana Log</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="brand"><img src="/icon.svg" alt="" width="26" height="26">Banana Log</span>
  </div>
</header>
<main id="view" class="wrap">
  <p class="muted loading">Loading…</p>
</main>
<nav class="tabs" aria-label="Sections">
  <div class="tabs-inner">
    <a href="#today" data-view="today">Today</a>
    <a href="#history" data-view="history">History</a>
    <a href="#add" data-view="add">Add</a>
    <a href="#labs" data-view="labs">Labs</a>
    <a href="#settings" data-view="settings">Settings</a>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>

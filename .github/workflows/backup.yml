name: Nightly backup

on:
  schedule:
    - cron: '17 7 * * *' # about 3 a.m. Eastern
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.143.0
  BACKUP_REPO: dblanken/banana-log-data

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Export the D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" d1 export banana-log --remote --output="${RUNNER_TEMP}/banana-log.sql"

      - name: Commit the dump to the private backup repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$BACKUP_REPO_TOKEN" | base64 -w0)"
          echo "::add-mask::${basic}"  # the encoded token isn't masked automatically
          auth="AUTHORIZATION: basic ${basic}"
          git init -q data
          cd data
          git remote add origin "https://github.com/${BACKUP_REPO}.git"
          # The backup repo starts empty, so the first run has no main branch to fetch.
          if git -c "http.https://github.com/.extraheader=${auth}" fetch -q --depth 1 origin main; then
            git checkout -q -B main FETCH_HEAD
          else
            git checkout -q --orphan main
          fi
          cp "${RUNNER_TEMP}/banana-log.sql" banana-log.sql
          git add banana-log.sql
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
            exit 0
          fi
          git -c user.name="banana-log backup" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Backup $(date -u +%Y-%m-%dT%H:%MZ)"
          git -c "http.https://github.com/.extraheader=${auth}" push -q origin HEAD:main
          echo "Backed up $(wc -c < banana-log.sql) bytes."
